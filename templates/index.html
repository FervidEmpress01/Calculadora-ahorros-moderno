<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Ahorro MN25B</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        #alertPlaceholder .alert {
            box-shadow: 0 4px 14px rgba(0,0,0,0.08);
        }
    </style>
</head>
<body class="bg-light">

<div class="container py-5">
    <h1 class="text-center mb-4">💰 Calculadora de Interés Real</h1>

    <div class="row">
        <div class="col-md-4">
            <div class="card p-4 shadow-sm">
                <h4>Ingresa tus datos</h4>
                <div id="alertPlaceholder"></div>

                <form method="POST" id="calcForm">
                    <div class="mb-3">
                        <label>Monto Inicial ($)</label>
                        <input type="number" step="any" name="v0" id="v0" class="form-control numeric money-limit" required placeholder="Ej: 1000" value="{{ request.form.v0 }}" max="490800000000">
                    </div>

                    <div class="mb-3">
                        <label>Aporte Periódico ($)</label>
                        <input type="number" step="any" name="aporte" id="aporte" class="form-control numeric money-limit" required placeholder="Ej: 100" value="{{ request.form.aporte }}" max="490800000000">
                    </div>

                    <div class="mb-3">
                        <label>Frecuencia de Aporte</label>
                        <select name="frecuencia" id="selectorFrecuencia" class="form-select">
                            <option value="Semanal" selected>Semanal</option>
                            <option value="Mensual">Mensual</option>
                            <option value="Bimestral">Bimestral</option>
                            <option value="Trimestral">Trimestral</option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label id="labelPeriodos">Número de Semanas</label>
                        <input type="number" name="periodos" id="periodos" class="form-control numeric-int" required placeholder="Ej: 52" value="{{ request.form.periodos }}">
                    </div>

                    <div class="mb-3">
                        <label>Meta Final Deseada ($)</label>
                        <input type="number" step="any" name="vf" id="vf" class="form-control numeric money-limit" required placeholder="Ej: 2500" value="{{ request.form.vf }}" max="490800000000">
                    </div>

                    <button type="submit" class="btn btn-primary w-100">Calcular Tasa Necesaria</button>
                </form>
                
                {% if error %}
                    <div class="alert alert-danger mt-3">{{ error }}</div>
                {% endif %}
            </div>
        </div>

        <div class="col-md-8">
            {% if tasa %}
                <div class="alert alert-success">
                    <h3>✅ Tasa {{ frecuencia_nombre }} Requerida: {{ tasa }}%</h3>
                </div>

                <ul class="nav nav-tabs" id="myTab" role="tablist">
                    <li class="nav-item"><button class="nav-link active" data-bs-toggle="tab" data-bs-target="#grafica">Gráfica</button></li>
                    <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#tabla">Tabla Detallada</button></li>
                </ul>

                <div class="tab-content bg-white p-3 border border-top-0">
                    <div class="tab-pane fade show active text-center" id="grafica">
                        <img src="data:image/png;base64,{{ grafica }}" class="img-fluid" alt="Gráfica de ahorro">
                    </div>
                    <div class="tab-pane fade" id="tabla">
                        <div class="table-responsive" style="max-height: 400px; overflow-y: auto;">
                            {{ tabla | safe }}
                        </div>
                    </div>
                </div>
            {% else %}
                <div class="alert alert-info">
                    Ingresa los datos a la izquierda para ver el análisis numérico.
                </div>
            {% endif %}
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
// --- CONFIGURACIÓN ---
const MAX_WEALTH = 490800000000; // 490.800 Millones

const alertPlaceholder = document.getElementById('alertPlaceholder');
let alertTimeout = null;

function showBootstrapAlert(message, type = 'warning', timeout = 4000) {
    clearTimeout(alertTimeout);
    alertPlaceholder.innerHTML = `
        <div class="alert alert-${type} alert-dismissible fade show" role="alert">
            ${message}
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
    `;
    alertTimeout = setTimeout(() => {
        const node = alertPlaceholder.querySelector('.alert');
        if (node) {
            const bsAlert = bootstrap.Alert.getOrCreateInstance(node);
            bsAlert.close();
        }
    }, timeout);
}

function isAllowedKey(event) {
    const allowedControlKeys = ['Backspace','ArrowLeft','ArrowRight','Delete','Tab','Home','End'];
    if (allowedControlKeys.includes(event.key)) return true;
    if (/^[0-9]$/.test(event.key)) return true;
    if (event.key === '.' || event.key === ',') return true;
    return false;
}

function sanitizeValue(value, allowDecimal = true) {
    value = value.replace(/,/g, '.');
    if (allowDecimal) {
        value = value.replace(/[^0-9.]/g, '');
        const parts = value.split('.');
        if (parts.length > 1) {
            value = parts[0] + '.' + parts.slice(1).join('');
        }
    } else {
        value = value.replace(/[^0-9]/g, '');
    }
    return value;
}

// 1. VALIDACIÓN CAMPOS NUMÉRICOS (DECIMALES)
document.querySelectorAll('input.numeric').forEach(inp => {
    inp.addEventListener('keydown', (e) => {
        if (!isAllowedKey(e)) {
            e.preventDefault();
            showBootstrapAlert('Solo se permiten números y punto decimal.', 'warning');
        } else {
            if (e.key === '+' || e.key === '-' || e.key.toLowerCase() === 'e') {
                e.preventDefault();
                showBootstrapAlert('No se permiten +, - ni notación científica.', 'warning');
            }
        }
    });
    
    inp.addEventListener('input', (e) => {
        const original = inp.value;
        const cleaned = sanitizeValue(original, true);
        
        // Validación de caracteres extraños
        if (original !== cleaned) {
            inp.value = cleaned;
            showBootstrapAlert('Entrada corregida: caracteres inválidos eliminados.', 'warning');
        }

        // --- VALIDACIÓN DE ELON MUSK (LÍMITE MÁXIMO) ---
        if (inp.classList.contains('money-limit')) {
            const numericVal = parseFloat(cleaned);
            if (numericVal > MAX_WEALTH) {
                inp.value = MAX_WEALTH; // Lo truncamos al máximo
                showBootstrapAlert('¡Alto ahí! El valor no puede superar los $490.800 Millones (Estimado de Elon Musk).', 'danger');
            }
        }
    });
});

// 2. VALIDACIÓN ENTEROS (PERIODOS)
document.querySelectorAll('input.numeric-int').forEach(inp => {
    inp.addEventListener('keydown', (e) => {
        if (!isAllowedKey(e)) {
            e.preventDefault();
            showBootstrapAlert('Solo números enteros.', 'warning');
        } else {
            if (e.key === '.' || e.key === ',' || e.key === '+' || e.key === '-' || e.key.toLowerCase() === 'e') {
                e.preventDefault();
                showBootstrapAlert('Este campo solo acepta números enteros.', 'warning');
            }
        }
    });
    inp.addEventListener('input', (e) => {
        const original = inp.value;
        const cleaned = sanitizeValue(original, false);
        if (original !== cleaned) {
            inp.value = cleaned;
            showBootstrapAlert('Entrada corregida: solo enteros.', 'warning');
        }
    });
});

// 3. CAMBIO DE TÍTULO SEGÚN FRECUENCIA
const selector = document.getElementById('selectorFrecuencia');
const label = document.getElementById('labelPeriodos');
// Solo dejamos los que están en el HTML
const mapeoNombres = {
    'Semanal': 'Semanas', 
    'Mensual': 'Meses',
    'Bimestral': 'Bimestres', 
    'Trimestral': 'Trimestres'
};

selector.addEventListener('change', function() {
    const seleccion = this.value;
    label.textContent = 'Número de ' + mapeoNombres[seleccion];
});
</script>
</body>
</html>
