<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Ahorro MN25B</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        /* Pequeño estilo para la alerta flotante */
        #alertPlaceholder .alert {
            box-shadow: 0 4px 14px rgba(0,0,0,0.08);
        }
    </style>
</head>
<body class="bg-light">

<div class="container py-5">
    <h1 class="text-center mb-4">💰 Calculadora de Interés Real</h1>

    <div class="row">
        <div class="col-md-4">
            <div class="card p-4 shadow-sm">
                <h4>Ingresa tus datos</h4>

                <div id="alertPlaceholder"></div>

                <form method="POST" id="calcForm">
                    <div class="mb-3">
                        <label>Monto Inicial ($)</label>
                        <input type="number" step="any" name="v0" id="v0" class="form-control numeric money-limit" required placeholder="Ej: 1000">
                    </div>

                    <div class="mb-3">
                        <label>Frecuencia del Periodo</label>
                        <select id="selectorFrecuencia" class="form-select">
                            <option value="semanal">Semanal</option>
                            <option value="mensual" selected>Mensual</option>
                            <option value="bimestral">Bimestral</option>
                            <option value="trimestral">Trimestral</option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label>Aporte Periódico ($)</label>
                        <input type="number" step="any" name="aporte" id="aporte" class="form-control numeric money-limit" required placeholder="Ej: 100">
                    </div>
                    
                    <div class="mb-3">
                        <label id="labelPeriodos">Número de Meses</label>
                        <input type="number" name="periodos" id="periodos" class="form-control numeric-int" required placeholder="Ej: 12">
                    </div>
                    
                    <div class="mb-3">
                        <label>Meta Final Deseada ($)</label>
                        <input type="number" step="any" name="vf" id="vf" class="form-control numeric money-limit" required placeholder="Ej: 2500">
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Calcular Tasa Necesaria</button>
                </form>
                
                {% if error %}
                    <div class="alert alert-danger mt-3">{{ error }}</div>
                {% endif %}
            </div>
        </div>

        <div class="col-md-8">
            {% if tasa %}
                <div class="alert alert-success">
                    <h3>✅ Tasa Requerida: {{ tasa }}% por periodo</h3>
                </div>

                <ul class="nav nav-tabs" id="myTab" role="tablist">
                    <li class="nav-item"><button class="nav-link active" data-bs-toggle="tab" data-bs-target="#grafica">Gráfica</button></li>
                    <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#tabla">Tabla Detallada</button></li>
                </ul>

                <div class="tab-content bg-white p-3 border border-top-0">
                    <div class="tab-pane fade show active" id="grafica">
                        <img src="data:image/png;base64,{{ grafica }}" class="img-fluid" alt="Gráfica de ahorro">
                    </div>
                    <div class="tab-pane fade" id="tabla">
                        <div class="table-responsive" style="max-height: 400px; overflow-y: auto;">
                            {{ tabla | safe }}
                        </div>
                    </div>
                </div>
            {% else %}
                <div class="alert alert-info">
                    Ingresa los datos a la izquierda para ver el análisis numérico.
                </div>
            {% endif %}
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
// --- CONFIGURACIÓN ---
const MAX_WEALTH = 490800000000; // Límite de Elon Musk

const alertPlaceholder = document.getElementById('alertPlaceholder');
let alertTimeout = null;

function showBootstrapAlert(message, type = 'warning', timeout = 4000) {
    clearTimeout(alertTimeout);
    alertPlaceholder.innerHTML = `
        <div class="alert alert-${type} alert-dismissible fade show" role="alert">
            ${message}
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
    `;
    alertTimeout = setTimeout(() => {
        const node = alertPlaceholder.querySelector('.alert');
        if (node) {
            const bsAlert = bootstrap.Alert.getOrCreateInstance(node);
            bsAlert.close();
        }
    }, timeout);
}

// Keys permitidas: dígitos, punto, comas, control
function isAllowedKey(event) {
    const allowedControlKeys = [
        'Backspace','ArrowLeft','ArrowRight','Delete','Tab','Home','End'
    ];
    if (allowedControlKeys.includes(event.key)) return true;
    if (/^[0-9]$/.test(event.key)) return true;
    if (event.key === '.' || event.key === ',') return true;
    return false;
}

function sanitizeValue(value, allowDecimal = true) {
    value = value.replace(/,/g, '.');
    if (allowDecimal) {
        value = value.replace(/[^0-9.]/g, '');
        const parts = value.split('.');
        if (parts.length > 1) {
            value = parts[0] + '.' + parts.slice(1).join('');
        }
    } else {
        value = value.replace(/[^0-9]/g, '');
    }
    return value;
}

// 1. INPUTS NUMÉRICOS (Lógica combinada: Pobreza + Musk)
document.querySelectorAll('input.numeric').forEach(inp => {
    // Keydown: Bloqueo de teclas invalidas
    inp.addEventListener('keydown', (e) => {
        if (!isAllowedKey(e)) {
            e.preventDefault();
            showBootstrapAlert('Solo se permiten números y punto decimal.', 'warning');
        } else {
            if (e.key === '+' || e.key === '-' || e.key.toLowerCase() === 'e') {
                e.preventDefault();
                showBootstrapAlert('No se permiten +, - ni notación científica.', 'warning');
            }
        }
    });

    // Input: Validaciones lógicas en tiempo real
    inp.addEventListener('input', function() {
        // A) Validar Pobreza (Bloqueo de ceros a la izquierda)
        if (/^00/.test(this.value)) {
            showBootstrapAlert('¡Nadie puede ser tan pobre! (No pongas tantos ceros)', 'danger');
            this.value = "0"; // Lo regresa a un solo cero
            return; // Salimos para no evaluar lo demás
        }

        // B) Sanitización normal
        const original = this.value;
        const cleaned = sanitizeValue(original, true);

        if (original !== cleaned) {
            this.value = cleaned;
            showBootstrapAlert('Entrada corregida: caracteres inválidos eliminados.', 'warning');
        }

        // C) Validar Límite Elon Musk (Solo si tiene la clase money-limit)
        if (this.classList.contains('money-limit')) {
            const numericVal = parseFloat(cleaned);
            if (numericVal > MAX_WEALTH) {
                this.value = MAX_WEALTH; // Truncamos al máximo
                showBootstrapAlert('¡Alto ahí! El valor no puede superar los $490.800 Millones (Estimado de Elon Musk).', 'danger');
            }
        }
    });
});

// 2. INPUTS ENTEROS (Periodos)
document.querySelectorAll('input.numeric-int').forEach(inp => {
    inp.addEventListener('keydown', (e) => {
        if (!isAllowedKey(e)) {
            e.preventDefault();
            showBootstrapAlert('Este campo solo acepta números enteros.', 'warning');
        } else {
            if (e.key === '.' || e.key === ',' || e.key === '+' || e.key === '-' || e.key.toLowerCase() === 'e') {
                e.preventDefault();
                showBootstrapAlert('Este campo solo acepta números enteros.', 'warning');
            }
        }
    });

    inp.addEventListener('input', function() {
        const original = this.value;
        const cleaned = sanitizeValue(original, false);
        if (original !== cleaned) {
            this.value = cleaned;
            showBootstrapAlert('Entrada corregida: solo enteros.', 'warning');
        }
    });
});

// 3. SELECTOR DE FRECUENCIA (Cambio dinámico de Label y Placeholder)
const selector = document.getElementById('selectorFrecuencia');
const labelPeriodos = document.getElementById('labelPeriodos');
const inputPeriodos = document.getElementById('periodos');

if(selector){
    selector.addEventListener('change', function() {
        // Borramos el valor actual para no confundir
        inputPeriodos.value = ''; 
        
        switch(this.value) {
            case 'semanal':
                labelPeriodos.textContent = "Número de Semanas";
                inputPeriodos.placeholder = "Ej: 52";
                break;
            case 'mensual':
                labelPeriodos.textContent = "Número de Meses";
                inputPeriodos.placeholder = "Ej: 12";
                break;
            case 'bimestral':
                labelPeriodos.textContent = "Número de Bimestres";
                inputPeriodos.placeholder = "Ej: 6";
                break;
            case 'trimestral':
                labelPeriodos.textContent = "Número de Trimestres";
                inputPeriodos.placeholder = "Ej: 4";
                break;
        }
    });
}

// 4. PREVENIR ENVÍO VACÍO
document.getElementById('calcForm').addEventListener('submit', function (e) {
    const fields = ['v0','aporte','periodos','vf'];
    for (let name of fields) {
        const el = document.querySelector(`[name="${name}"]`);
        if (!el) continue;
        const val = el.value.trim();
        if (val === '' || val === '.' ) {
            e.preventDefault();
            showBootstrapAlert('Por favor ingresa valores válidos en todos los campos.', 'danger');
            return false;
        }
    }
});
</script>
</body>
</html>
